[package]
name = "dotfilesync-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "dotfilesync"
path = "src/main.rs"

[dependencies]
dotfilesync-core = { path = "../dotfilesync-core" }
dotfilesync-protocol = { path = "../dotfilesync-protocol" }
dotfilesync-daemon = { path = "../dotfilesync-daemon" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.17"
assert_cmd = "2.0"
predicates = "3.1"
serde_json = "1.0"
