[package]
name = "dotfilesync-daemon"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Per-user dotfilesync daemon (dotfilesyncd) hosting dotfilesync-core behind local IPC"

[[bin]]
name = "dotfilesyncd"
path = "src/bin/dotfilesyncd.rs"

[dependencies]
dotfilesync-core = { path = "../dotfilesync-core" }
dotfilesync-protocol = { path = "../dotfilesync-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
thiserror = "2.0"
libc = "0.2"

[dev-dependencies]
tempfile = "3.17"
